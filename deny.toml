[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# POAM: unmaintained (not vulnerable) crates pulled in transitively by yew 0.23; re-check on each yew release.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via yew-macro (build-time only)" },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x via gloo-worker; console does not use yew workers" },
  # POAM: rsa 0.9 (via openidconnect) has no constant-time private-key ops. The gateway only VERIFIES
  # id_token signatures with the IdP's public keys; no private RSA key exists at runtime (test-only signing).
  # Re-check when openidconnect moves to a patched rsa.
  # POAM (M4): crypto-bigint 0.5.5 (not constant-time) via jsonwebtoken rust_crypto -> p256/p384 0.13. Only
  # hello-tool-server and gateway tests use it, to VERIFY ES256 with public keys; gateway signing and the sid
  # HMAC use ring (WU2). Re-check trigger: a jsonwebtoken/p256 release on crypto-bigint >= 0.6.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken rust_crypto: public-key ES256 verification only; signing uses ring" },
  { id = "RUSTSEC-2023-0071", reason = "Marvin: private-key timing only; gateway uses rsa for public-key signature verification" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
