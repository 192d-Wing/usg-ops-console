name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      # SA-11(1): static code analysis (clippy, -D warnings).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p console-shell --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo clippy -p console-shell --target wasm32-unknown-unknown --features gallery --locked -- -D warnings
      - run: cargo clippy -p console-ui --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      # M4: SDK browser transport/hooks and the hello-tool web example (wasm only).
      - run: cargo clippy -p console-sdk --features web --target wasm32-unknown-unknown --all-targets --locked -- -D warnings
      - run: cargo clippy -p hello-tool-web --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked

  gateway-integration:
    # M3: session store + audit log against a real Postgres (SC-23, AU-9/12).
    name: gateway integration (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # postgres:17-alpine (multi-arch index digest, resolved 2026-11-03)
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPASSWORD: ci-only-postgres
      POSTGRES_USER: postgres
      CONSOLE_TEST_DATABASE_URL: postgres://postgres:ci-only-postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Same SEC-006 role set as deploy/compose: NOLOGIN console_owner, NOLOGIN
      # console_app group, runtime console, console_audit, console_migrator.
      - name: Provision console DB roles (SEC-006 contract)
        run: sh deploy/compose/postgres/init/01-roles.sh
      - name: Gateway tests incl. Postgres integration
        shell: bash
        run: |
          set -o pipefail
          cargo test -p console-gateway --locked -- --nocapture 2>&1 | tee gateway-integration.log
          # A misconfigured service must not pass silently.
          if grep -q "NOT RUN" gateway-integration.log; then
            echo "::error::integration tests reported NOT RUN"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gateway-integration-log
          path: gateway-integration.log
          retention-days: 30
      # SEC-006/AU-9 evidence: migrate the provisioned DB as console_migrator
      # (not superuser), then assert ownership/grants.
      - name: Migrate as console_migrator and assert role contract
        env:
          CONSOLE_MIGRATOR_DATABASE_URL: postgres://console_migrator:dev-only-migrator-db@127.0.0.1:5432/console?sslmode=disable
        run: |
          cargo run -p console-gateway --locked -- migrate
          psql -v ON_ERROR_STOP=1 -U postgres -d console -f deploy/compose/postgres/check-roles.sql

  web:
    name: trunk build + bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: jetli/trunk-action@69821d4eec12c308c4b811e459e37556cf920057 # v0.5.0
        with:
          version: v0.22.1
      - run: trunk build --release
        working-directory: crates/console-shell
      - name: Release bundle is gallery-free (CM-7)
        run: |
          ls crates/console-shell/dist/*.wasm >/dev/null || { echo "no release wasm in dist to check"; exit 1; }
          if grep -l "Component gallery" crates/console-shell/dist/*.wasm; then
            echo "release dist contains gallery code (CM-7)"; exit 1
          fi
          echo "release dist is gallery-free"
      - name: Shell WASM gzip size <= 1.5 MB; warn > baseline x1.10 (PERF-001)
        env:
          WASM_GZ_BASELINE: "240530"  # M4.5 redesign accepted (fix round 3, 2026-11-04; +17.3% over M4 204,977 B, PERF-001 justified); warn > 264,583 B; see quality-gates.md
          WASM_GZ_MAX: "1572864"
        run: |
          size=$(gzip -c crates/console-shell/dist/*.wasm | wc -c | tr -d ' ')
          warn=$(( WASM_GZ_BASELINE * 110 / 100 ))
          echo "wasm gz bytes: $size (baseline $WASM_GZ_BASELINE, warn > $warn, max $WASM_GZ_MAX)"
          if [ "$size" -gt "$WASM_GZ_MAX" ]; then
            echo "::error::shell wasm gz $size B exceeds 1.5 MB budget"; exit 1
          fi
          if [ "$size" -gt "$warn" ]; then
            echo "::warning::shell wasm gz $size B is >10% over baseline $WASM_GZ_BASELINE B; justify in plan or update baseline"
          fi
      # M4: example tool bundle (not part of the shell budget; plan §6 target < 250 KB gz).
      - run: trunk build --release
        working-directory: examples/hello-tool/web
      - name: hello-tool WASM gzip size (report; warn > 250 KB)
        run: |
          size=$(gzip -c examples/hello-tool/web/dist/*.wasm | wc -c | tr -d ' ')
          echo "hello-tool wasm gz bytes: $size"
          if [ "$size" -gt 256000 ]; then echo "::warning::hello-tool wasm gz $size B > 250 KB target"; fi

  wasm-test:
    # POAM-003 / SA-11: console-ui wasm-bindgen tests in a headless browser.
    # Firefox + geckodriver ship on the ubuntu-latest runner image.
    name: console-ui wasm-bindgen tests (headless Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.1
      # shell: bash => -eo pipefail, so a failing suite fails the step despite tee.
      - run: |
          wasm-pack test --headless --firefox crates/console-ui 2>&1 | tee wasm-pack.log
          wasm-pack test --headless --firefox crates/console-shell 2>&1 | tee -a wasm-pack.log
          wasm-pack test --headless --firefox crates/console-sdk --features web 2>&1 | tee -a wasm-pack.log
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wasm-pack-log
          path: wasm-pack.log
          retention-days: 30

  e2e:
    # Playwright + axe through compose Keycloak + Postgres + Caddy TLS; three
    # host gateways started by Playwright webServer (see e2e/playwright.config.ts).
    name: e2e (Playwright chromium/firefox/webkit + prodlike + axe, compose auth stack, hello-tool)
    # Pinned: ubuntu-latest moved to 26.04 and a Playwright browser cache built
    # on 24.04 (WebKit links ICU 74 / libxml2.so.2) broke every WebKit test.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      COMPOSE: docker compose
      # Makefile prepends --env-file deploy/compose/ports.env (port single source).
      COMPOSE_FILES: -f deploy/compose/compose.yaml -f deploy/compose/compose.hostnet.yaml
      COMPOSE_ENV: --env-file deploy/compose/ports.env
      # e2e/tests/db-helpers.ts reaches the compose postgres via the engine CLI.
      E2E_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: jetli/trunk-action@69821d4eec12c308c4b811e459e37556cf920057 # v0.5.0
        with:
          version: v0.22.1
      # Always rebuild both bundles: main/idle/acr/rl gateways serve dist-gallery, dist-smoke serves dist.
      # M4: hello-tool web dist + server (upstream of the main/prodlike gateways).
      - run: make web web-gallery gateway hello
      # prodlike project (plan §0): real sibling hostnames for the console and
      # tool origins, so cookie tossing and same-site tool cookies are tested.
      - name: /etc/hosts entries for prodlike (*.ops.test -> 127.0.0.1)
        run: echo "127.0.0.1 console.ops.test hello.tools.ops.test evil.tools.ops.test" | sudo tee -a /etc/hosts
      # Also generates the DEV ONLY assertion key (never committed) and renders registries.
      - name: Compose stack up (postgres, keycloak, tls-proxy)
        run: make up
      # SEC-006: schema owned by console_owner; migrate as console_migrator before any gateway serves.
      - name: Migrate as console_migrator
        env:
          CONSOLE_MIGRATOR_DATABASE_URL: postgres://console_migrator:dev-only-migrator-db@127.0.0.1:5432/console?sslmode=disable
        run: ./target/release/console-gateway migrate
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx tsc --noEmit -p .
        working-directory: e2e
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
        working-directory: e2e
      - name: Playwright version
        id: pw
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' e2e/package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          # ImageOS (e.g. ubuntu24) keeps browser builds from crossing OS images.
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
        working-directory: e2e
      # Everything except the POAM-032 de-flake specs (normal CI retry policy).
      - run: npx playwright test --grep-invert @no-retry
        working-directory: e2e
        env:
          E2E_PRODLIKE: "1"
      # POAM-032: the former flakes run with no retries, three times each, so a
      # flake fails the job instead of hiding behind a retry.
      - name: POAM-032 specs, --retries=0 x3
        run: npx playwright test --grep @no-retry --retries=0 --repeat-each=3 --project=chromium --project=firefox --project=webkit
        working-directory: e2e
      - name: SEC-006 role contract after gateway migrations
        run: $COMPOSE $COMPOSE_ENV $COMPOSE_FILES exec -T postgres psql -U postgres -d console -v ON_ERROR_STOP=1 -f - < deploy/compose/postgres/check-roles.sql
      - name: Compose logs
        if: failure()
        run: $COMPOSE $COMPOSE_ENV $COMPOSE_FILES logs --no-color > compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Compose stack down
        if: always()
        run: $COMPOSE $COMPOSE_ENV $COMPOSE_FILES down -v

  sdk-js:
    name: sdk-js typecheck + vitest + npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - run: make sdk-js-test
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high
        working-directory: sdk-js

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  container:
    name: container build
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: podman build -f deploy/Containerfile -t usg-ops-console:ci .
      - name: Image has no dev realm or dev secrets (CM-7)
        run: |
          cid=$(podman create usg-ops-console:ci)
          podman export "$cid" | tar -t > image-files.txt
          podman rm "$cid"
          if grep -E 'realm-dev\.json|gateway\.env|deploy/compose' image-files.txt; then
            echo "::error::dev realm/secrets in image"; exit 1
          fi
          echo "image is free of dev realm/secrets"
