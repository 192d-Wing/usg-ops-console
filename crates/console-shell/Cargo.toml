[package]
name = "console-shell"
description = "The console web app (Yew/WASM): chrome, navigation, and tool container."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
console-protocol.workspace = true
console-ui.workspace = true
yew.workspace = true
yew-router.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "Storage", "HtmlElement", "MediaQueryList", "Location", "Request", "RequestInit", "RequestCredentials", "Response", "Headers", "VisibilityState"] }
js-sys.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true

[features]
# Component gallery at /gallery. Off by default so release/Containerfile
# builds omit it (CM-7); `make run` / `make web-gallery` enable it.
default = []
gallery = []
