[package]
name = "console-ui"
description = "Yew component library and design tokens for the console and its tools."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
yew.workspace = true
# Already in the dependency graph via yew; only extra feature flags are added.
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "FocusEvent",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "InputEvent",
  "KeyboardEvent",
  "MouseEvent",
  "Node",
  "NodeList",
  "SubmitEvent",
  "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { version = "0.3", features = ["KeyboardEventInit", "PointerEvent", "PointerEventInit", "EventInit", "DomTokenList", "CssStyleDeclaration"] }

[lints]
workspace = true
