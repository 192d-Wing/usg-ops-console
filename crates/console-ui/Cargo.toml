[package]
name = "console-ui"
description = "Yew component library and design tokens for the console and its tools."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []

[dependencies]
yew.workspace = true
# Already in the dependency graph via yew; only extra feature flags are added.
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "FocusEvent",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "KeyboardEvent",
  "MouseEvent",
  "Node",
  "NodeList",
  "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["KeyboardEventInit"] }

[lints]
workspace = true
