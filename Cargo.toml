[workspace]
resolver = "3"
members = ["crates/*", "examples/hello-tool/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-USG-Internal"
publish = false
rust-version = "1.88"

[workspace.dependencies]
console-protocol = { path = "crates/console-protocol" }
console-ui = { path = "crates/console-ui" }
console-sdk = { path = "crates/console-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# M3 gateway auth/session stack (gateway-only; never linked into WASM).
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cookie = "0.18"
rand = "0.9"
subtle = "2"
ipnet = "2"
url = "2"
base64 = "0.23"
sha2 = "0.11"
# M4 tool proxy + identity assertion (gateway / hello-tool server only; never linked into WASM).
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "logging", "tls12"] }
http-body = "1"
http-body-util = "0.1"
# ring / RustCrypto only (M3 decision: no aws-lc, no native-tls in the graph).
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
ring = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
