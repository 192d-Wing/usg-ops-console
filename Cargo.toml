[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-USG-Internal"
publish = false
rust-version = "1.88"

[workspace.dependencies]
console-protocol = { path = "crates/console-protocol" }
console-ui = { path = "crates/console-ui" }
console-sdk = { path = "crates/console-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# M3 gateway auth/session stack (gateway-only; never linked into WASM).
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cookie = "0.18"
rand = "0.9"
subtle = "2"
ipnet = "2"
url = "2"
base64 = "0.23"
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
